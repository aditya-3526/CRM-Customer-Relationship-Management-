# nginx site config for the CRM app.
# Install on the server with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/crm
#   sudo ln -sf /etc/nginx/sites-available/crm /etc/nginx/sites-enabled/crm
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain once you have one. The EC2 public IP works fine
    # for testing, and `_` matches any hostname.
    server_name _;

    root /var/www/crm;
    index index.html;

    # Don't advertise the nginx version in error pages and headers.
    server_tokens off;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API proxy ----------------------------------------------------------
    # Everything under /api goes to the Node process on loopback. This is what
    # lets the frontend use relative URLs and skip CORS entirely.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # The Gemini-backed AI routes can be slow. Default 60s is too tight.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # --- Static assets ------------------------------------------------------
    # CRA emits content-hashed filenames under /static, so these are safe to
    # cache permanently.
    location /static/ {
        expires 1y;
        # Security headers repeated for the same inheritance reason as below.
        # nosniff matters most here — these are the actual script and style files.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, immutable" always;
    }

    # --- SPA fallback -------------------------------------------------------
    # React Router owns client-side routes. Any unmatched path must return
    # index.html rather than a 404, or deep links and refreshes break.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, otherwise clients keep loading a
    # stale bundle reference after a deploy.
    #
    # The security headers are repeated here deliberately. nginx's add_header
    # does NOT inherit from an outer block once the inner block defines even one
    # add_header of its own — so listing only Cache-Control here would silently
    # drop nosniff, X-Frame-Options and Referrer-Policy for the one document that
    # most needs them. This is the single most commonly misunderstood nginx
    # inheritance rule.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    client_max_body_size 2m;
}
